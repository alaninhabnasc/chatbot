<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DialogX - Salão</title>
<style>
body{background:#7b43b4;font-family:Arial;margin:0;display:flex;justify-content:center;align-items:center;height:100vh}
.chat-container{background:#dde1ff;width:380px;max-width:95%;padding:20px;border-radius:15px;display:flex;flex-direction:column;box-shadow:0 0 10px #0003}
.logo{display:flex;gap:10px;align-items:center;margin-bottom:10px}.logo img{width:60px;height:60px;border-radius:50%}.logo span{font-size:24px;color:#4b0082;font-weight:bold}
#chat{height:420px;overflow-y:auto;margin-bottom:10px}.message{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:80%;white-space:pre-wrap}.bot{background:#fff;color:#4b0082}.user{background:#7b43b4;color:#fff;margin-left:auto}.input-row{display:flex;gap:8px}input{flex:1;padding:10px;border-radius:10px;border:1px solid #ccc}button{background:#7b43b4;color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer}
</style></head><body>
<div class="chat-container"><div class="logo"><img src="logo.jpeg"><span>DialogX</span></div><div id="chat"></div><div class="input-row"><input id="userInput" placeholder="Digite aqui..."><button onclick="sendMessage()">Enviar</button></div></div>
<script>
const chat=document.getElementById("chat");
let modo="";
function botMessage(t){
 let d=document.createElement("div");
 d.className="message bot";
 const texto=t.replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" style="color:#25D366;font-weight:bold;text-decoration:none;">💬 Falar com uma atendente</a>');
 d.innerHTML=texto.replace(/\n/g,"<br>");
 chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function userMessage(t){let d=document.createElement("div");d.className="message user";d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
window.onload=()=>{botMessage("Olá! 💜");botMessage("Bem-vindo ao Salão Bella Estética.");botMessage("Antes de começarmos, escolha o tipo de atendimento:");botMessage("1️⃣ Detalhado\n2️⃣ Direto");}
document.getElementById("userInput").addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage();});
async function sendMessage(){
let input=document.getElementById("userInput");let msg=input.value.trim();if(!msg)return;userMessage(msg);input.value="";
if(!modo){
 if(msg=="1"||msg.toLowerCase().includes("detal")){modo="detalhado";botMessage("Perfeito! Farei um atendimento acolhedor e detalhado. 😊");return;}
 if(msg=="2"||msg.toLowerCase().includes("dire")){modo="direto";botMessage("Perfeito! Responderei de forma rápida e objetiva. 👍");return;}
 botMessage("Escolha 1 para Detalhado ou 2 para Direto.");return;}
let estilo=modo==="detalhado"?"Seja muito simpática, acolhedora, explique tudo em até 6 frases, use poucos emojis e sempre agradeça.":"Seja objetiva, responda em no máximo 2 frases, vá direto ao ponto e agradeça.";
let prompt=`Você é Sofia, recepcionista do Salão Bella Estética.
${estilo}
Serviços: Corte Feminino R$70, Corte Masculino R$45, Escova R$40, Hidratação R$80, Progressiva a partir de R$250, Coloração a partir de R$180, Manicure R$35, Pedicure R$40, Design de sobrancelhas R$30, Maquiagem R$120.
Horário: Segunda a Sexta 08:00 às 18:00. Sábado 08:00 às 16:00.
Pagamento: PIX, Cartão e Dinheiro.
Nunca invente informações. Responda em português.
Quando a conversa terminar ou o cliente quiser atendimento humano, finalize agradecendo e inclua:
https://wa.me/5589981101951
Pergunta: ${msg}`;
botMessage("Digitando...");
try{
let r=await fetch("https://text.pollinations.ai/"+encodeURIComponent(prompt));
let txt=await r.text();
document.querySelector(".bot:last-child").remove();
botMessage(txt);
}catch(e){document.querySelector(".bot:last-child").remove();botMessage("Desculpe, não conseguimos entender, por favor repetir.");}
}
</script></body></html>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background-color: #6A1B9A;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

.container {
    background-color: #DDE1FF;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 500px;
    padding: 40px;
}

.logo {
    text-align: center;
    margin-bottom: 10px;
}

.logo img {
    height: 180px;
    max-width: 100%;
}

h1 {
    color: #6A1B9A;
    font-size: 20px;
    text-align: center;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 25px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #4A148C;
    font-size: 14px;
    font-weight: 600;
}

input {
    width: 100%;
    padding: 15px;
    border: 2px solid #6A1B9A;
    border-radius: 12px;
    font-size: 15px;
}

input::placeholder {
    color: #6A1B9A;
    opacity: 0.6;
}

small {
    display: block;
    margin-top: 5px;
    font-size: 12px;
    color: #6A1B9A;
}

.buttons {
    display: flex;
    gap: 15px;
    margin-top: 20px;
}

.btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 50px;
    background-color: #6A1B9A;
    color: white;
    cursor: pointer;
    font-weight: 600;
}

.login-area {
    margin-top: 25px;
    text-align: center;
    font-size: 14px;
    color: #4A148C;
}

.login-area a {
    color: #6A1B9A;
    font-weight: 700;
    text-decoration: none;
}

.login-area a:hover {
    text-decoration: underline;
}

@media (max-width: 768px) {
    body {
        background-color: #DDE1FF;
        padding: 0;
    }

    .container {
        min-height: 100svh;
        border-radius: 0;
        box-shadow: none;
        max-width: 100%;
        padding: 30px 20px;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">
        <img src="dialogx.jpeg" alt="Logo">
    </div>

    <h1>A melhor assistência para sua empresa</h1>

    <form id="cadastroForm">

        <div class="form-group">
            <label>Nome da empresa</label>
            <input id="empresa" type="text" placeholder="Ex: DialogX Tecnologia" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" placeholder="exemplo@gmail.com" required>
        </div>

        <div class="form-group">
            <label>CNPJ</label>
            <input id="cnpj" type="text" placeholder="00.000.000/0000-00" required>
        </div>

        <div class="form-group">
            <label>Telefone</label>
            <input id="telefone" type="tel" placeholder="(11) 99999-9999" required>
        </div>

        <div class="form-group">
            <label>Senha</label>
            <input id="senha" type="password" placeholder="Crie uma senha segura" minlength="8" required>
            <small>Mínimo de 8 caracteres, com pelo menos 1 letra maiúscula e 1 número</small>
        </div>

        <div class="form-group">
            <label>Repita sua senha</label>
            <input id="confirmarSenha" type="password" placeholder="Digite a senha novamente" minlength="8" required>
        </div>

        <div class="buttons">
            <button
                type="button"
                class="btn"
                onclick="window.location.href='https://alaninhabnasc.github.io/telainicial/'">
                Voltar
            </button>

            <button type="submit" class="btn">Próximo</button>
        </div>

    </form>

    <div class="login-area">
        Já tem conta?
        <a href="../login/index.html">Fazer login</a>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDek3zi1FTTRwGecaarfnAwHCpt5SWneNM",
    authDomain: "dialogx-fd1ce.firebaseapp.com",
    projectId: "dialogx-fd1ce",
    storageBucket: "dialogx-fd1ce.firebasestorage.app",
    messagingSenderId: "106113955668",
    appId: "1:106113955668:web:5e2b53b8e9639ad90dbac1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const senha = document.getElementById("senha");
const confirmarSenha = document.getElementById("confirmarSenha");

document.getElementById("cadastroForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const regexSenha = /^(?=.*[A-Z])(?=.*\d).{8,}$/;

    if (!regexSenha.test(senha.value)) {
        alert("A senha deve ter no mínimo 8 caracteres, com 1 letra maiúscula e 1 número.");
        return;
    }

    if (senha.value !== confirmarSenha.value) {
        alert("As senhas não conferem");
        return;
    }

    await addDoc(collection(db, "empresas"), {
        empresa: empresa.value,
        email: email.value,
        cnpj: cnpj.value,
        telefone: telefone.value,
        criadoEm: new Date()
    });

    window.location.href = "../app2/index.html";
});
</script>

</body>
</html>
